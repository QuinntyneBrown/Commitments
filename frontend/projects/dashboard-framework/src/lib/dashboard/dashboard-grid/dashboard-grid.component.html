<section class="dashboard-grid" data-testid="dashboard-grid" [class.dashboard-grid--edit-mode]="layoutStore.isEditMode()">
  @if (isEmpty()) {
    <div class="dashboard-grid__empty" data-testid="dashboard-empty-state">
      <h2>No tiles on this dashboard</h2>
      <p>Tap the <strong>+</strong> button to add a tile.</p>
    </div>
  } @else {
    <gridster [options]="gridsterOptions()">
      @for (item of items(); track item.instanceId) {
        <gridster-item [item]="item" [attr.data-tile-id]="item.tileId" data-testid="dashboard-tile">
          @if (layoutStore.isEditMode()) {
            <div class="tile-chrome">
              <div class="tile-chrome__drag" aria-hidden="true">
                <span class="material-symbols-rounded">drag_indicator</span>
                <span class="tile-chrome__drag-label">DRAG</span>
              </div>
              <button
                type="button"
                class="tile-chrome__remove"
                data-testid="remove-tile"
                (click)="removeTile(item.instanceId)"
                aria-label="Remove tile"
              >
                <span class="material-symbols-rounded">close</span>
              </button>
            </div>
          }

          @if (registry.getTile(item.tileId); as descriptor) {
            <ng-container *ngComponentOutlet="descriptor.componentType; injector: tileInjector(item)"></ng-container>
          } @else {
            <span class="dashboard-grid__missing">{{ item.tileId }}</span>
          }
        </gridster-item>
      }
    </gridster>
  }
</section>
