<div class="dashboard-shell" data-testid="dashboard-shell">
  <app-primary-header title="Dashboard">
    <cui-mode-toggle
      header-actions
      data-testid="dashboard-mode-toggle"
      [mode]="modeService.mode()"
      (modeChange)="onModeChange($event)">
    </cui-mode-toggle>
  </app-primary-header>

  @if (modeService.mode() === 'review') {
    <div class="dashboard-shell__scrubber-slot" data-testid="dashboard-scrubber-slot">
      <df-review-scrubber></df-review-scrubber>
    </div>
  }

  <main class="dashboard-shell__main">
    <commitments-dashboard-grid></commitments-dashboard-grid>
  </main>
</div>
