<div class="dashboard-shell" data-testid="dashboard-shell">
  <app-primary-header title="Dashboard" [editMode]="layoutStore.isEditMode()">
    @if (layoutStore.isEditMode()) {
      <ng-container title-adornment>
        <span class="dashboard-shell__edit-pill" data-testid="edit-mode-pill">
          <span class="material-symbols-rounded dashboard-shell__edit-pill-icon">edit</span>
          <span class="dashboard-shell__edit-pill-label">EDIT MODE</span>
        </span>
      </ng-container>
    }
    @if (layoutStore.isEditMode()) {
      <ng-container header-actions>
        <button
          type="button"
          class="dashboard-shell__done"
          data-testid="edit-mode-done"
          (click)="exitEditMode()"
        >
          <span class="material-symbols-rounded dashboard-shell__done-icon">check</span>
          <span class="dashboard-shell__done-label">DONE</span>
        </button>
      </ng-container>
    } @else {
      <ng-container header-actions>
        <cui-mode-toggle
          data-testid="dashboard-mode-toggle"
          [mode]="modeService.mode()"
          (modeChange)="onModeChange($event)">
        </cui-mode-toggle>
        @if (modeService.mode() === 'live') {
          <button
            type="button"
            class="dashboard-shell__edit"
            data-testid="edit-mode-enter"
            aria-label="Edit dashboard"
            (click)="enterEditMode()"
          >
            <span class="material-symbols-rounded">edit</span>
            <span class="dashboard-shell__edit-label">EDIT</span>
          </button>
        }
      </ng-container>
    }
  </app-primary-header>

  @if (modeService.mode() === 'review') {
    <div class="dashboard-shell__scrubber-slot" data-testid="dashboard-scrubber-slot">
      <df-review-scrubber></df-review-scrubber>
    </div>
  }

  <main class="dashboard-shell__main">
    <commitments-dashboard-grid></commitments-dashboard-grid>
  </main>

  @if (modeService.mode() === 'live') {
    <button
      type="button"
      class="dashboard-shell__fab"
      data-testid="add-tile-fab"
      aria-label="Add tile"
      (click)="openAddTileDialog()"
    >
      <span class="material-symbols-rounded">add</span>
    </button>
  }
</div>
