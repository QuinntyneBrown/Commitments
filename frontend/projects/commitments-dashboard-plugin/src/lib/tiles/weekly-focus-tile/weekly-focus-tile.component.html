<commitments-tile-shell
  title="Weekly Focus"
  [eyebrow]="controller.weekLabel() || 'This week'"
  icon="date_range"
  variant="metric"
  data-testid="weekly-focus-tile"
>
  @if (controller.focusAreas().length === 0) {
    <p class="empty">No focus set for this week.</p>
  } @else {
    <ul class="focus-list">
      @for (item of controller.focusAreas(); track item.rank) {
        <li>
          <strong>{{ item.name }}</strong>
          <span>{{ item.supportingMetric }}</span>
        </li>
      }
    </ul>
  }
</commitments-tile-shell>
