<commitments-tile-shell title="Consistency Trend" eyebrow="7-day rolling average · last 14 days" icon="trending_up" variant="chart" data-testid="consistency-trend-tile">
  <cui-status-pill tile-status [variant]="pillVariant()" [pulse]="pillVariant() === 'chart'" [label]="pillLabel()">
  </cui-status-pill>

  <div class="trend-row">
    <cui-metric-header
      accent="chart"
      caption="today"
      [value]="controller.currentPercentage() + '%'"
      [subCaption]="'Peak ' + controller.peakPercentage() + '% / Low ' + controller.lowPercentage() + '%'">
    </cui-metric-header>

    <cui-delta-badge
      [delta]="controller.deltaPercentage()"
      format="percent"
      [caption]="controller.deltaCaption()">
    </cui-delta-badge>
  </div>

  <div class="plot">
    <canvas #plot data-testid="consistency-trend-canvas" aria-label="Goal completion rate trend chart"></canvas>
  </div>
</commitments-tile-shell>
