<commitments-tile-shell
  title="Outstanding To‑Dos"
  eyebrow="Queue"
  icon="checklist"
  variant="metric"
  data-testid="outstanding-todos-tile"
>
  <cui-status-pill
    [variant]="controller.mode()"
    [pulse]="controller.mode() === 'live'"
    [label]="statusLabel()"
  ></cui-status-pill>

  <div class="todo-body">
    <div class="todo-count">{{ controller.count() }}</div>
    <p class="todo-copy">items need attention before the next review.</p>
  </div>

  @if (controller.deltaLabel()) {
    <p
      class="todo-delta"
      [class.todo-delta--success]="controller.deltaTone() === 'success'"
      [class.todo-delta--warn]="controller.deltaTone() === 'warn'"
    >
      {{ controller.deltaLabel() }}
    </p>
  }
</commitments-tile-shell>
