<commitments-tile-shell
  title="Monthly Progress"
  eyebrow="30 days"
  icon="calendar_month"
  variant="metric"
  data-testid="monthly-progress-tile"
>
  <cui-status-pill
    [variant]="controller.mode()"
    [pulse]="controller.mode() === 'live'"
    [label]="statusLabel()"
  ></cui-status-pill>

  @if (controller.isEmpty()) {
    <p class="empty">No activity in this 30-day window.</p>
  } @else {
    <div class="bars" role="img" aria-label="Monthly progress by week">
      @for (bucket of controller.buckets(); track bucket.weekStart; let i = $index) {
        <span
          [style.height.%]="bucket.percentage"
          [attr.aria-label]="'Week ' + (i + 1) + ': ' + bucket.percentage + '% complete'"
        ></span>
      }
    </div>
    <div class="bar-labels" aria-hidden="true">
      @for (bucket of controller.buckets(); track bucket.weekStart; let i = $index) {
        <span>W{{ i + 1 }}</span>
      }
    </div>
  }
</commitments-tile-shell>
