<commitments-tile-shell
  title="Relations"
  eyebrow="Balance"
  icon="diversity_3"
  variant="metric"
  data-testid="relations-tile"
>
  <cui-status-pill
    [variant]="controller.mode()"
    [pulse]="controller.mode() === 'live'"
    [label]="statusLabel()"
  ></cui-status-pill>

  @if (controller.isEmpty()) {
    <p class="empty">No commitments yet.</p>
  } @else {
    <div class="relations">
      @for (relation of controller.relations(); track relation.behaviourTypeId) {
        <div class="relations__row">
          <span>{{ relation.name }}</span>
          <strong>{{ relation.percentage }}%</strong>
        </div>
      }
    </div>
  }
</commitments-tile-shell>
