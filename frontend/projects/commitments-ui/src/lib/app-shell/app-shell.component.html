<section class="app-shell">
  <ng-content select="[app-toolbar]"></ng-content>
  <mat-sidenav-container class="app-shell__body">
    <mat-sidenav class="app-shell__sidenav" [mode]="mode()" [opened]="opened()" (openedChange)="opened.set($event)">
      <ng-content select="[app-sidenav]"></ng-content>
    </mat-sidenav>
    <mat-sidenav-content class="app-shell__content">
      <ng-content></ng-content>
    </mat-sidenav-content>
  </mat-sidenav-container>
</section>
