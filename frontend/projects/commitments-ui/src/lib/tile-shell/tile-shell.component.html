<mat-card
  [class]="'tile-shell tile-shell--' + variant()"
  appearance="outlined"
  data-testid="tile-shell">
  <mat-card-header class="tile-shell__header">
    @if (icon()) {
      <span class="material-symbols-rounded tile-shell__icon">{{ icon() }}</span>
    }
    <div class="tile-shell__heading">
      <mat-card-title class="tile-shell__title" data-testid="tile-title">{{ title() }}</mat-card-title>
      @if (eyebrow()) {
        <p class="tile-shell__eyebrow">{{ eyebrow() }}</p>
      }
    </div>
    <ng-content select="[tile-status]"></ng-content>
  </mat-card-header>

  <mat-card-content class="tile-shell__body">
    <ng-content></ng-content>
  </mat-card-content>
</mat-card>
