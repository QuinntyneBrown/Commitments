<div class="table-row" [class.table-row--header]="variant() === 'header'" role="row">
  @for (cell of cells(); track $index) {
    <span class="table-row__cell" [attr.role]="roleForCell()" [style.flex]="flexFor(cell)" [style.justify-content]="justifyFor(cell)">
      {{ cell.text }}
    </span>
  }
  @if (showActions()) {
    <span class="table-row__actions" role="cell">
      <button mat-icon-button type="button" aria-label="Edit" (click)="edit.emit()">
        <mat-icon aria-hidden="true">edit</mat-icon>
      </button>
      <button mat-icon-button type="button" color="warn" aria-label="Delete" (click)="remove.emit()">
        <mat-icon aria-hidden="true">delete</mat-icon>
      </button>
    </span>
  }
  <ng-content select="[row-actions]"></ng-content>
</div>
