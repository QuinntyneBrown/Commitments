<mat-card class="metric-tile" appearance="outlined">
  <mat-card-header class="metric-tile__header">
    <mat-icon aria-hidden="true">monitoring</mat-icon>
    <div>
      <mat-card-title>{{ title() }}</mat-card-title>
      <mat-card-subtitle>{{ subtitle() }}</mat-card-subtitle>
    </div>
    <span class="metric-tile__spacer"></span>
    <cui-status-pill variant="live" label="LIVE" [pulse]="true"></cui-status-pill>
  </mat-card-header>
  <mat-card-content>
    <div class="metric-tile__summary">
      <strong>{{ value() }}</strong>
      <div>
        <span>{{ caption() }}</span>
        <cui-delta-badge [delta]="delta()" [caption]="deltaCaption()"></cui-delta-badge>
      </div>
    </div>
    <div class="metric-tile__bars" aria-hidden="true">
      @for (bar of bars(); track $index) {
        <span class="metric-tile__bar" [class.metric-tile__bar--today]="$last" [style.height]="barHeight(bar)"></span>
      }
    </div>
    <div class="metric-tile__labels" aria-hidden="true">
      @for (label of labels(); track $index) {
        <span [class.metric-tile__label--today]="$last">{{ label }}</span>
      }
    </div>
  </mat-card-content>
</mat-card>
