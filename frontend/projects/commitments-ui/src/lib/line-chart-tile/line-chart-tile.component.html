<mat-card class="line-tile" appearance="outlined">
  <mat-card-header class="line-tile__header">
    <mat-icon aria-hidden="true">show_chart</mat-icon>
    <div>
      <mat-card-title>{{ title() }}</mat-card-title>
      <mat-card-subtitle>{{ subtitle() }}</mat-card-subtitle>
    </div>
    <span class="line-tile__spacer"></span>
    <cui-status-pill variant="neutral" label="LIVE"></cui-status-pill>
  </mat-card-header>
  <mat-card-content>
    <div class="line-tile__summary">
      <strong>{{ value() }}</strong>
      <div>
        <span>{{ caption() }}</span>
        <cui-delta-badge [delta]="delta()" [caption]="deltaCaption()"></cui-delta-badge>
      </div>
      <span class="line-tile__range">{{ rangeLabel() }}</span>
    </div>
    <svg class="line-tile__chart" viewBox="0 0 100 44" preserveAspectRatio="none" aria-hidden="true">
      <path class="line-tile__area" [attr.d]="areaPath()"></path>
      <polyline class="line-tile__line" [attr.points]="polylinePoints()"></polyline>
    </svg>
    <div class="line-tile__labels" aria-hidden="true">
      @for (label of labels(); track label) {
        <span [class.line-tile__label--active]="$last">{{ label }}</span>
      }
    </div>
  </mat-card-content>
</mat-card>
