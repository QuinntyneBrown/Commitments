<section class="dialog-shell">
  @if (title()) {
    <h2 mat-dialog-title>{{ title() }}</h2>
  }
  <mat-dialog-content>
    <ng-content></ng-content>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <ng-content select="[dialog-actions]"></ng-content>
    @if (showCancel()) {
      <button mat-button type="button" (click)="cancel.emit()">{{ cancelLabel() }}</button>
    }
    @if (showConfirm()) {
      <button mat-raised-button color="primary" type="button" (click)="confirm.emit()">{{ confirmLabel() }}</button>
    }
  </mat-dialog-actions>
</section>
