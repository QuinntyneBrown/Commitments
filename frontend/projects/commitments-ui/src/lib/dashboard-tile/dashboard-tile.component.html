<mat-card [class]="'dashboard-tile dashboard-tile--' + accent()" appearance="outlined">
  <mat-card-header class="dashboard-tile__header">
    <mat-icon aria-hidden="true">{{ icon() }}</mat-icon>
    <mat-card-title>{{ title() }}</mat-card-title>
  </mat-card-header>
  <mat-card-content class="dashboard-tile__body">
    @if (value()) {
      <strong class="dashboard-tile__value">{{ value() }}</strong>
    }
    @if (caption()) {
      <span class="dashboard-tile__caption">{{ caption() }}</span>
    }
    <ng-content></ng-content>
  </mat-card-content>
</mat-card>
