<mat-card class="review-tile" appearance="outlined">
  <mat-card-header class="review-tile__header">
    <mat-icon aria-hidden="true">today</mat-icon>
    <mat-card-title>{{ title() }}</mat-card-title>
    <span class="review-tile__spacer"></span>
    @if (dateLabel()) {
      <cui-status-pill variant="review" [label]="dateLabel()"></cui-status-pill>
    }
  </mat-card-header>
  <mat-card-content class="review-tile__body">
    <strong>{{ value() }}</strong>
    <span>{{ caption() }}</span>
  </mat-card-content>
  <mat-card-actions class="review-tile__footer">
    <cui-delta-badge [delta]="delta()" format="count" [caption]="deltaCaption()"></cui-delta-badge>
    <span class="review-tile__spacer"></span>
    <span class="review-tile__snapshot">{{ snapshotLabel() }}</span>
  </mat-card-actions>
</mat-card>
