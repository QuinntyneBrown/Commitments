@switch (appearance()) {
  @case ('stroked') {
    <button mat-stroked-button class="cui-button" [color]="materialColor()" [type]="type()" [disabled]="disabled()" (click)="emitClick($event)">
      @if (icon()) {
        <mat-icon aria-hidden="true">{{ icon() }}</mat-icon>
      }
      @if (label()) {
        {{ label() }}
      } @else {
        <ng-content></ng-content>
      }
    </button>
  }
  @case ('basic') {
    <button mat-button class="cui-button" [color]="materialColor()" [type]="type()" [disabled]="disabled()" (click)="emitClick($event)">
      @if (icon()) {
        <mat-icon aria-hidden="true">{{ icon() }}</mat-icon>
      }
      @if (label()) {
        {{ label() }}
      } @else {
        <ng-content></ng-content>
      }
    </button>
  }
  @case ('icon') {
    <button mat-icon-button class="cui-button cui-button--icon" [color]="materialColor()" [type]="type()" [disabled]="disabled()" [attr.aria-label]="ariaLabel() || label() || icon()" (click)="emitClick($event)">
      <mat-icon aria-hidden="true">{{ icon() }}</mat-icon>
    </button>
  }
  @case ('fab') {
    <button mat-fab class="cui-button cui-button--fab" [color]="materialColor()" [type]="type()" [disabled]="disabled()" [attr.aria-label]="ariaLabel() || label() || icon()" (click)="emitClick($event)">
      <mat-icon aria-hidden="true">{{ icon() }}</mat-icon>
    </button>
  }
  @case ('mini-fab') {
    <button mat-mini-fab class="cui-button cui-button--mini-fab" [color]="materialColor()" [type]="type()" [disabled]="disabled()" [attr.aria-label]="ariaLabel() || label() || icon()" (click)="emitClick($event)">
      <mat-icon aria-hidden="true">{{ icon() }}</mat-icon>
    </button>
  }
  @case ('extended-fab') {
    <button mat-fab extended class="cui-button cui-button--extended-fab" [color]="materialColor()" [type]="type()" [disabled]="disabled()" (click)="emitClick($event)">
      @if (icon()) {
        <mat-icon aria-hidden="true">{{ icon() }}</mat-icon>
      }
      @if (label()) {
        {{ label() }}
      } @else {
        <ng-content></ng-content>
      }
    </button>
  }
  @default {
    <button mat-raised-button class="cui-button" [color]="materialColor()" [type]="type()" [disabled]="disabled()" (click)="emitClick($event)">
      @if (icon()) {
        <mat-icon aria-hidden="true">{{ icon() }}</mat-icon>
      }
      @if (label()) {
        {{ label() }}
      } @else {
        <ng-content></ng-content>
      }
    </button>
  }
}
