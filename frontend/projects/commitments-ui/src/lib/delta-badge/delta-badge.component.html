<mat-chip-set class="delta-badge-set" aria-label="Delta">
  <mat-chip class="delta-badge" [class]="'delta-badge delta-badge--' + tone()">
    <span class="delta-badge__value">{{ formatted() }}</span>
    @if (caption()) {
      <span class="delta-badge__caption">{{ caption() }}</span>
    }
  </mat-chip>
</mat-chip-set>
