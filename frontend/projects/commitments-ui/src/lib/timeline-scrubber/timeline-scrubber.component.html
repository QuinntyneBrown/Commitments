<mat-card class="timeline" appearance="outlined">
  <header class="timeline__top">
    <mat-icon aria-hidden="true">history</mat-icon>
    <span class="timeline__label">{{ label() }}</span>
    <strong class="timeline__date">{{ dateLabel() }}</strong>
    <span class="timeline__spacer"></span>
    <button mat-icon-button type="button" aria-label="Previous" [disabled]="disabled()" (click)="previous.emit()">
      <mat-icon aria-hidden="true">chevron_left</mat-icon>
    </button>
    <button mat-mini-fab type="button" color="primary" aria-label="Play" [disabled]="disabled()" (click)="play.emit()">
      <mat-icon aria-hidden="true">play_arrow</mat-icon>
    </button>
    <button mat-icon-button type="button" aria-label="Next" [disabled]="disabled()" (click)="next.emit()">
      <mat-icon aria-hidden="true">chevron_right</mat-icon>
    </button>
    <button mat-button type="button" [disabled]="disabled()" (click)="jumpToday.emit()">
      <mat-icon aria-hidden="true">fast_forward</mat-icon>
      Jump to today
    </button>
  </header>
  <mat-slider class="timeline__slider" [min]="min()" [max]="max()" [step]="step()" [disabled]="disabled()">
    <input matSliderThumb [value]="value()" (valueChange)="updateValue($event)" />
  </mat-slider>
  @if (ticks().length) {
    <div class="timeline__ticks" aria-hidden="true">
      @for (tick of ticks(); track tick.label) {
        <span [class.timeline__tick--active]="tick.active">{{ tick.label }}</span>
      }
    </div>
  }
</mat-card>
