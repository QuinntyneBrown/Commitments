<mat-card>
  <mat-card-header>
    <mat-card-title>
      <h1>Commitments</h1>
    </mat-card-title>
    <mat-card-subtitle>Login</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="signIn()">
      <mat-form-field>
        <mat-label>Username</mat-label>
        <input matInput formControlName="username" id="username" autocomplete="username" />
      </mat-form-field>
      <mat-form-field>
        <mat-label>Password</mat-label>
        <input matInput type="password" formControlName="password" id="password" autocomplete="current-password" />
      </mat-form-field>
      <button mat-flat-button type="submit" [disabled]="form.invalid">Submit</button>
    </form>
  </mat-card-content>
</mat-card>
