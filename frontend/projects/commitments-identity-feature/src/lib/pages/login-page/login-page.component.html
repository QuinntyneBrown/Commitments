<mat-card>
  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="signIn()">
      <mat-form-field>
        <mat-label>Username</mat-label>
        <input matInput formControlName="username" id="username" autocomplete="username" />
      </mat-form-field>
      <mat-form-field>
        <mat-label>Password</mat-label>
        <input matInput type="password" formControlName="password" id="password" autocomplete="current-password" />
      </mat-form-field>
      @if (error()) {
        <p class="error">{{ error() }}</p>
      }
      <button mat-flat-button type="submit">Sign in</button>
    </form>
  </mat-card-content>
</mat-card>
