<app-primary-header>
  {{ "To Do's" | translate }}
</app-primary-header>

<section class="page-content-container">
  <app-data-table [rows]="toDos()" [columns]="columns" [pageSize]="5"></app-data-table>

  <ng-template #editTpl let-row>
    <button
      mat-icon-button
      type="button"
      [attr.aria-label]="'Edit ' + row.name"
      (click)="$event.stopPropagation(); handleEditToDoCellClick({ data: row })"
    >
      <mat-icon>edit</mat-icon>
    </button>
  </ng-template>

  <ng-template #deleteTpl let-row>
    <button
      mat-icon-button
      type="button"
      [attr.aria-label]="'Delete ' + row.name"
      (click)="$event.stopPropagation(); handleRemoveToDoCellClick({ data: row })"
    >
      <mat-icon>close</mat-icon>
    </button>
  </ng-template>

  <button mat-fab class="tracking-fab" type="button" (click)="handleFabButtonClick()">
    <mat-icon>add</mat-icon>
  </button>
</section>
