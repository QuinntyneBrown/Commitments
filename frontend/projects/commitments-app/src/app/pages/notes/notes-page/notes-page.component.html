<app-primary-header>
  {{ 'Notes' | translate }}
</app-primary-header>

<section class="page-content-container">
  <app-data-table [rows]="notes()" [columns]="columns" [pageSize]="5"></app-data-table>

  <ng-template #titleTpl let-row>
    <a class="note-title-link" [routerLink]="['/edit-note', row.slug]">{{ row.title }}</a>
  </ng-template>

  <ng-template #deleteTpl let-row>
    <button
      mat-icon-button
      type="button"
      [attr.aria-label]="'Delete ' + row.title"
      (click)="$event.stopPropagation(); handleDelete({ data: row })"
    >
      <mat-icon>close</mat-icon>
    </button>
  </ng-template>
</section>
