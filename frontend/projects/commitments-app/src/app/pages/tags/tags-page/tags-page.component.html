<app-primary-header>
  {{ 'Tags' | translate }}
</app-primary-header>

<section class="page-content-container">
  <app-data-table [rows]="tags()" [columns]="columns" [pageSize]="5"></app-data-table>

  <ng-template #nameTpl let-row>
    <mat-form-field appearance="outline" class="tag-name-input">
      <input
        matInput
        maxlength="120"
        [ngModel]="row.name"
        (ngModelChange)="onNameInput(row, $event)"
        (blur)="handleChange({ data: row })"
        (keyup.enter)="handleChange({ data: row })"
      />
    </mat-form-field>
  </ng-template>

  <ng-template #deleteTpl let-row>
    <button
      mat-icon-button
      type="button"
      [attr.aria-label]="'Delete ' + row.name"
      (click)="$event.stopPropagation(); handleDelete({ data: row })"
    >
      <mat-icon>close</mat-icon>
    </button>
  </ng-template>

  <div class="actions">
    <button mat-button type="button" (click)="handleCreateClick()">
      {{ 'Create' | translate }}
    </button>
  </div>
</section>
