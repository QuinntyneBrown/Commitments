<div class="dashboard-layout" data-testid="dashboard-layout">
  <header class="dashboard-layout__toolbar" data-testid="dashboard-layout-toolbar">
    <button
      type="button"
      class="dashboard-layout__hamburger"
      data-testid="dashboard-layout-hamburger"
      aria-label="Toggle navigation"
      (click)="toggleSidenav()"
    >
      <span class="material-symbols-rounded">menu</span>
    </button>
    <span class="dashboard-layout__brand">Commitments</span>
    <span class="dashboard-layout__spacer"></span>
    <span class="dashboard-layout__profile-name" data-testid="dashboard-layout-profile-name">{{ profileName() }}</span>
    <span class="dashboard-layout__avatar" data-testid="dashboard-layout-avatar" aria-hidden="true"></span>
  </header>
  <div class="dashboard-layout__body">
    <nav
      class="dashboard-layout__sidenav"
      data-testid="dashboard-sidenav"
      [ngClass]="{ 'dashboard-layout__sidenav--collapsed': !sidenavOpen() }"
      aria-label="Primary"
    >
      @for (item of navItems; track item.routerLink) {
        <a
          class="sidenav-item"
          [routerLink]="item.routerLink"
          routerLinkActive="sidenav-item--active"
          [routerLinkActiveOptions]="{ exact: !!item.exact }"
          [attr.data-testid]="'sidenav-item-' + item.label"
        >
          <span class="material-symbols-rounded sidenav-item__icon">{{ item.icon }}</span>
          <span class="sidenav-item__label">{{ item.label }}</span>
        </a>
      }
      <button
        type="button"
        class="sidenav-item"
        data-testid="sidenav-item-Logout"
        (click)="logout()"
      >
        <span class="material-symbols-rounded sidenav-item__icon">logout</span>
        <span class="sidenav-item__label">Logout</span>
      </button>
    </nav>
    <main class="dashboard-layout__content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
