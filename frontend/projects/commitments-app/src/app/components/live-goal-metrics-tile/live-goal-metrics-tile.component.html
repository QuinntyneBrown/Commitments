<commitments-tile-shell title="Live Goal Metrics" eyebrow="Goal Progress" icon="track_changes" variant="metric" data-testid="live-goal-metrics-tile">
  <cui-status-pill variant="live" [pulse]="true" label="LIVE" data-testid="live-goal-metrics-live-badge"></cui-status-pill>

  <cui-metric-header
    accent="live"
    [value]="controller.percentDisplay()"
    [caption]="controller.count() + ' of ' + controller.target() + ' done today'">
  </cui-metric-header>

  <div class="trend">
    <cui-delta-badge
      [delta]="controller.deltaVsYesterday()"
      format="count"
      caption="vs yesterday">
    </cui-delta-badge>
  </div>

  <div class="bars" aria-label="Last 14 days of progress">
    @for (point of controller.last14(); track point.date; let last = $last) {
      <div
        class="bars__bar"
        [class.bars__bar--today]="last"
        [style.height.%]="point.percent < 4 ? 4 : point.percent"
        [attr.title]="point.date + ': ' + point.completed + '/' + point.target">
      </div>
    }
  </div>

  <div class="readout">
    <span data-testid="live-goal-metrics-count">{{ controller.count() }}</span>
    <span class="readout__separator">/</span>
    <span data-testid="live-goal-metrics-target">{{ controller.target() }}</span>
  </div>
</commitments-tile-shell>
