<commitments-tile-shell title="Review Goal History" eyebrow="Goal History" status="Review" data-testid="review-goal-history-tile">
  <div class="window">
    <label class="window__field">
      <span class="window__label">Start</span>
      <input
        type="datetime-local"
        data-testid="review-goal-history-start"
        (change)="onStartChange($event)" />
    </label>
    <label class="window__field">
      <span class="window__label">End</span>
      <input
        type="datetime-local"
        data-testid="review-goal-history-end"
        (change)="onEndChange($event)" />
    </label>
    <button
      type="button"
      class="window__apply"
      data-testid="review-goal-history-apply"
      [disabled]="!controller.canApply()"
      (click)="controller.apply()">
      Apply
    </button>
  </div>

  <div class="metric">
    <span class="metric__value">
      <span data-testid="review-goal-history-count">{{ controller.count() }}</span>
      <span class="metric__separator">/</span>
      <span data-testid="review-goal-history-target">{{ controller.target() }}</span>
    </span>
    <span class="metric__label">at scrub instant</span>
  </div>

  <input
    type="range"
    min="0"
    max="100"
    class="scrub"
    data-testid="review-goal-history-scrub"
    [value]="controller.scrubPct()"
    (input)="onScrubChange($event)"
    aria-label="Scrub through historical window" />

  <div class="review-badge" data-testid="review-goal-history-review-badge" aria-label="Reviewing historical data">
    <span class="review-badge__dot"></span>
    REVIEW
  </div>
</commitments-tile-shell>
