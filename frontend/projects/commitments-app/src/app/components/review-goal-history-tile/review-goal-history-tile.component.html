<commitments-tile-shell title="Review Goal History" eyebrow="Goal Snapshot" variant="review" data-testid="review-goal-history-tile">
  <cui-status-pill variant="review" label="REVIEW" data-testid="review-goal-history-review-badge"></cui-status-pill>

  <div class="date-badge" data-testid="review-goal-history-date-badge">
    {{ controller.selectedDateLabel() }}
  </div>

  <cui-metric-header
    accent="review"
    [value]="controller.count() + ' / ' + controller.target()"
    [caption]="controller.isEmpty() ? 'No achievements that day' : 'Snapshot at end of day'">
  </cui-metric-header>

  <div class="trend-row">
    <cui-delta-badge
      [delta]="controller.delta()"
      format="count"
      caption="vs today">
    </cui-delta-badge>
  </div>

  <div class="readout">
    <span data-testid="review-goal-history-count">{{ controller.count() }}</span>
    <span class="readout__separator">/</span>
    <span data-testid="review-goal-history-target">{{ controller.target() }}</span>
  </div>
</commitments-tile-shell>
